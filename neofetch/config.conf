# icat placement uses whole cells; transparent padding provides a half-cell offset.
display_image() {
    local columns=$((width / font_width))
    local rows=$((height / font_height))
    local display_size=$((columns * font_width))
    local top_padding=$((font_height / 2))
    local aligned_image

    ((rows * font_height < display_size)) && display_size=$((rows * font_height))
    aligned_image="${image%.*}-${display_size}px-top${top_padding}.png"

    if [[ ! -f "$aligned_image" ]]; then
        convert "$image" -resize "${display_size}x${display_size}" \
            -background none -gravity north -splice "0x${top_padding}" \
            "$aligned_image" || return 1
    fi

    kitty +kitten icat --align left \
        --place "${columns}x$((rows + 1))@${xoffset}x${yoffset}" \
        "$aligned_image"
}

