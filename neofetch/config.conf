# 绘制逻辑
print_info() {
    local LC_ALL="${sys_locale:-en_US.UTF-8}"
    local content line plain prefix label_padding rule palette color_index
    local palette_width palette_padding
    local item mem_used mem_total mem_perc
    local box_width=${#box_title}
    local -a rows=() widths=()

    content="$(
        unset text_padding
        if [[ "$stdout" != "on" ]]; then
            subtitle_color=$'\e[38;2;107;215;249m'
            colon_color=$'\e[33m'
            info_color=$'\e[39m'
        fi

        for item in "${show_info[@]}"; do
            case "$item" in
                title)
                    get_title
                    prin " User/Hostname" "${user}@${hostname}"
                    ;;
                model) prin " Machine" "$(sysctl -n hw.model)" ;;
                kernel) info " Kernel" kernel ;;
                distro) info " OS" distro ;;
                de) info " Desktop Environment" de ;;
                wm) info " Window Manager" wm ;;
                shell) info " Shell" shell ;;
                term) info " Terminal" term ;;
                packages) info " Packages" packages ;;
                uptime) info " Uptime" uptime ;;
                local_ip) info " Local IP" local_ip ;;
                resolution) info " Resolution" resolution ;;
                cpu) info " CPU" cpu ;;
                gpu) info " GPU" gpu ;;
                memory)
                    case "$os" in
                        "Mac OS X" | "macOS" | "iPhone OS")
                            mem_total="$(sysctl -n hw.memsize)"
                            mem_used="$(vm_stat | awk '
                                /page size of/ {
                                    match($0, /[0-9]+/)
                                    page_size = substr($0, RSTART, RLENGTH)
                                }
                                /^Pages active:/ { active = $3 + 0 }
                                /^Pages wired down:/ { wired = $4 + 0 }
                                /^Pages occupied by compressor:/ { compressed = $5 + 0 }
                                END { printf "%.0f", (active + wired + compressed) * page_size }
                            ')"
                            prin " Memory" "$(bar "$mem_used" "$mem_total")"
                            ;;
                        *)
                            get_memory
                            prin " Memory" "$(bar "$mem_perc" 100)"
                            ;;
                    esac
                    ;;
                disk) info " Disk" disk ;;
                battery) info " Battery" battery ;;
                *) err "Info: Unknown show_info item '$item'." ;;
            esac
        done
    )"

    while IFS= read -r line; do
        # Neofetch uses ANSI white for bar brackets rather than the terminal foreground.
        line="${line//$'\e[37m['/$'\e[39m['}"
        line="${line//$'\e[37m]'/$'\e[39m]'}"
        plain="$line"
        while [[ "$plain" =~ $'\e'\[[0-9\;]*m ]]; do
            plain="${plain//"${BASH_REMATCH[0]}"}"
        done
        if [[ "$plain" == *➞* ]]; then
            prefix="${plain%%➞*}"
            label_padding=$((label_width - ${#prefix}))
            printf -v line '%s%*s➞%s' "${line%%➞*}" "$label_padding" '' "${line#*➞}"
            printf -v plain '%s%*s➞%s' "$prefix" "$label_padding" '' "${plain#*➞}"
        fi
        rows+=("$line")
        widths+=("${#plain}")
        ((${#plain} > box_width)) && box_width=${#plain}
    done <<< "$content"

    if [[ "$color_blocks" == "on" && "$stdout" != "on" ]]; then
        palette_width=$((box_width / ${#palette_glyph} * ${#palette_glyph}))
        palette_padding=$(((box_width - palette_width) / 2))
        printf -v palette '%*s' "$palette_padding" ''
        for ((color_index=0; color_index<palette_width / ${#palette_glyph}; color_index++)); do
            printf -v palette '%s\e[38;5;%sm%s' "$palette" \
                "${palette_colors[color_index % ${#palette_colors[@]}]}" "$palette_glyph"
        done
        rows+=("" "$palette")
        widths+=(0 "$((palette_padding + palette_width))")
    fi

    printf -v rule '%*s' "$((box_width + 4))" ''
    rule="${rule// /─}"
    printf '%b┌%s%s┐%b\n' "${text_padding:+\e[${text_padding}C}${reset}" \
        "$box_title" "${rule:${#box_title}}" "$reset"
    printf '%b│  %*s  │%b\n' "${text_padding:+\e[${text_padding}C}" "$box_width" '' "$reset"
    for ((color_index=0; color_index<${#rows[@]}; color_index++)); do
        printf '%b│  %b%*s  │%b\n' "${text_padding:+\e[${text_padding}C}" \
            "${rows[color_index]}${reset}" "$((box_width - widths[color_index]))" '' "$reset"
    done
    printf '%b│  %*s  │%b\n' "${text_padding:+\e[${text_padding}C}" "$box_width" '' "$reset"
    printf '%b└%s┘%b\n' "${text_padding:+\e[${text_padding}C}" "$rule" "$reset"
    info_height=$((${#rows[@]} + 4))
}

